name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stable-release
  cancel-in-progress: false
jobs:
  quality:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/checks.yml
  publish:
    needs: quality
    runs-on: macos-15
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Release only commits merged into main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tested-app
          path: artifacts
      - name: Restore exactly the tested bundle
        run: |
          mkdir -p dist
          ditto -xk artifacts/tested-app.zip dist
          codesign --verify --deep --strict 'dist/Codex Meter.app'
          python3 scripts/fetch-sparkle.py
      - name: Sign archive and feed, publish draft last
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: python3 scripts/release.py
